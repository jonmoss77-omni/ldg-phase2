<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LDG Deluxe Geometry Proof</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main id="viewer" aria-label="LDG Deluxe garage condo geometry proof"></main>
    <header class="proof-header">
      <div>
        <p class="eyebrow">LDG Waterside Phase 2</p>
        <h1>Deluxe garage condo geometry proof</h1>
      </div>
      <p class="status"><span></span>Internal validation only</p>
    </header>
    <nav class="presets" aria-label="Camera views">
      <button class="active" data-view="exterior">Exterior approach</button>
      <button data-view="threshold">At the entrance</button>
      <button data-view="interior">Inside the shell</button>
    </nav>
    <aside class="facts">
      <p class="fact-title">Confirmed geometry</p>
      <dl>
        <div><dt>Footprint</dt><dd>28 x 50 ft</dd></div>
        <div><dt>Shell</dt><dd>22 ft</dd></div>
        <div><dt>Door height</dt><dd>14 ft</dd></div>
        <div><dt>Mezzanine</dt><dd>12 ft level</dd></div>
      </dl>
      <p class="provisional">Garage-door width and facade opening positions are proportional studies pending measured elevations.</p>
    </aside>
    <div class="loading" role="status">Loading geometry</div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
